[project]
name = "clanker-extraction-slm"
version = "0.1.0"
description = "Extractive SLM for project-memory span detection in coding prompts"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "accelerate>=0.24",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "wandb>=0.16",
    "pydantic>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
